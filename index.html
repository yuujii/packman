<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パックマン</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>パックマン</h1>
        <div class="game-info">
            <div class="score">スコア: <span id="score">0</span></div>
            <div class="lives">残機: <span id="lives">3</span></div>
            <button id="startBtn">ゲーム開始</button>
        </div>

        <!-- 速度調整UI -->
        <div class="speed-control">
            <label for="speedSlider">
                移動速度: <span id="speedValue">中速 (12)</span>
            </label>
            <input type="range" id="speedSlider" min="6" max="20" value="12" step="2">
            <div class="speed-labels">
                <span>速い</span>
                <span>遅い</span>
            </div>
        </div>

        <canvas id="gameCanvas" width="560" height="560"></canvas>

        <!-- モバイル用仮想十字キー -->
        <div class="mobile-controls">
            <div class="dpad">
                <button class="dpad-btn dpad-up" data-direction="up">▲</button>
                <button class="dpad-btn dpad-left" data-direction="left">◀</button>
                <button class="dpad-btn dpad-center"></button>
                <button class="dpad-btn dpad-right" data-direction="right">▶</button>
                <button class="dpad-btn dpad-down" data-direction="down">▼</button>
            </div>
        </div>

        <div class="controls">
            <p class="desktop-hint">PC: 矢印キー (↑↓←→) で操作</p>
            <p class="mobile-hint">スマホ: 十字キーまたはスワイプで操作</p>
            <p>すべてのドット（餌）を食べてゴーストから逃げよう！</p>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
